name: Capture movie tracker screenshot

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - name: Install dependencies
        working-directory: ci
        run: npm ci

      - name: Capture screenshot
        working-directory: ci
        run: npm run capture:screenshot

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: movie-tracker-screenshot-${{ github.run_id }}
          name: Movie Tracker Screenshot ${{ github.run_number }}
          body: Automated screenshot generated from run ${{ github.run_number }} (id ${{ github.run_id }}).
          files: ci/.out/movie-tracker.png
          overwrite_files: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
