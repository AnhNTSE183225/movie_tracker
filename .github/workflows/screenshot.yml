name: Capture movie tracker screenshot

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "movies-data.js"
      - "scripts/**"
      - "package.json"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture screenshot
        run: npm run capture:screenshot

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: movie-tracker-screenshot
          name: Movie Tracker Screenshot
          body: Automated screenshot generated from the latest CSV update.
          files: .out/movie-tracker.png
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
