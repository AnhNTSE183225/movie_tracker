name: Deploy movie tracker to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Inject Firebase Config
        run: echo "${{ secrets.FIREBASE_WEB_CONFIG }}" > public/firebase-config.json

      - name: Cache Busting
        run: |
          sed -i 's/\.js"/.js?v=${{ github.sha }}"/g' public/index.html
          sed -i 's/\.css"/.css?v=${{ github.sha }}"/g' public/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5